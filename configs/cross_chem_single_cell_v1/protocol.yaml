schema: 1
network_from: configs/cross_chem_cycle_soft_difference_v1/combination.yaml
training:
  pretrain_epochs: 100
  target_epochs: 100
  logical_batch: 32
  micro_batch: 8
  inference_chunk: 8
  lr: 0.001
  weight_decay: 0.01
  shuffle: false
  precision: float32
  checkpoint_every: 1
  selection: fixed_final_epoch
  test_during_training: false
  finetune_parameters: all_encoder_and_own_head
  finetune_optimizer: fresh_AdamW
  pretrain_reuse: one_LFP_checkpoint_per_seed_independent_target_restarts
labels:
  transform: natural_log_cycles_divided_by_fixed_1000
  fixed_cycle_unit: 1000.0
  empirical_statistics: false
input:
  raw_six_channels: true
  clip_absolute_over: 10.0
  cycle_difference: false
data:
  protocol: reuse_verified_existing_two_model_protocols
  source_chemistry: LFP
  source_count: 275
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
